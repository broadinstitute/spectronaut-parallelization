name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: cd src \ docker build . --file panoply_spectronaut_v20-3.dockerfile --tag cameronlian/panoply-spectronaut:v20.3
